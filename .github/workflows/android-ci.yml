name: Android CI

on:
  push:
    branches: ['dev', 'main']
    tags:
      - 'v*'
    paths:
      - 'mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: ['dev', 'main']
    paths:
      - 'mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  CYPRESS_INSTALL_BINARY: '0'

jobs:
  ci:
    name: Expo checks and Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 缓存保留在 GitHub Actions，不启用额外的商业缓存服务。
          cache-provider: basic

      - name: Install mobile workspace dependencies
        run: npm ci --workspace @xiehe/mobile --no-audit --no-fund

      - name: Type check
        run: npm run type-check:mobile

      - name: Lint
        run: npm run lint --workspace @xiehe/mobile

      - name: Test
        run: npm run test --workspace @xiehe/mobile

      - name: Export Android, iOS and Web bundles
        run: npm run export:mobile

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      # CI 制品供安装验证，正式签名与自动发布后续单独配置。
      - name: Build Android release APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --console=plain --no-daemon --max-workers=2

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: mobile-android-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
