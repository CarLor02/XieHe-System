[project]
name = "xiehe-medical-backend"
version = "0.1.0"
description = "XieHe medical imaging system backend"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiofiles==23.2.1",
    "aiocache[redis]==0.12.3",
    "aiokafka==0.12.0",
    "alembic==1.13.1",
    "asyncmy==0.2.9",
    "bcrypt==3.2.2",
    "click==8.1.7",
    "cryptography==41.0.7",
    "email-validator==2.1.0.post1",
    "fastapi==0.104.1",
    "gunicorn==21.2.0",
    "httpx==0.25.2",
    "openpyxl==3.1.5",
    "orjson==3.9.10",
    "passlib[bcrypt]==1.7.4",
    "pillow==10.1.0",
    "psutil==5.9.6",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "pyjwt==2.8.0",
    "pymysql==1.1.0",
    "python-dateutil==2.8.2",
    "python-docx>=1.1,<2",
    "python-dotenv==1.0.0",
    "python-jose[cryptography]==3.3.0",
    "python-json-logger==2.0.7",
    "python-multipart==0.0.6",
    "redis>=5.0.1,<9",
    "reportlab>=4.2,<5",
    "requests==2.31.0",
    "sqlalchemy==2.0.23",
    "starlette==0.27.0",
    "structlog==23.2.0",
    "uvicorn[standard]==0.24.0",
]

[dependency-groups]
dev = [
    "mypy==1.10.1",
    "pre-commit>=4.2,<5",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
    "types-aiofiles>=24.1",
    "types-openpyxl>=3.1",
    "types-passlib>=1.7",
    "types-pillow>=10.2",
    "types-psutil>=7.0",
    "types-python-dateutil>=2.9",
    "types-reportlab>=4.4",
    "types-requests>=2.32",
]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "htmlcov",
    "tests/legacy",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "C90"]
ignore = ["E501"]
mccabe.max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/contexts/patients/infrastructure/persistence/models.py" = ["E741"] # Blood group O is a domain enum value.

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
files = ["app", "scripts", "tests"]
exclude = ["tests/(legacy|manual|db_tools|fixtures)", "htmlcov"]
mypy_path = "."
explicit_package_bases = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
disallow_any_generics = false
allow_untyped_globals = true
disable_error_code = ["arg-type", "attr-defined"]

[[tool.mypy.overrides]]
module = ["aiocache.*", "aiokafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [
    "legacy",
    "manual",
    "db_tools",
    "fixtures",
    "__pycache__",
    ".pytest_cache",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=80",
    "--no-cov-on-fail",
]
asyncio_mode = "auto"
minversion = "7.0"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow tests",
    "auth: authentication tests",
    "database: database tests",
    "api: API tests",
    "service: service tests",
    "model: model tests",
    "utils: utility tests",
    "external: external service tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/env/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
