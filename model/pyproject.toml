[project]
name = "xiehe-model-services"
version = "0.1.0"
description = "Shared runtime for AP and LAT measurement services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "python-multipart==0.0.6",
    "pydantic==2.5.3",
    "ultralytics==8.4.144",
    "opencv-python==4.9.0.80",
    "numpy==1.26.4",
    "pillow==10.2.0",
    "torch==2.5.1+cpu",
    "torchvision==0.20.1+cpu",
    "pandas==2.3.3",
    "openpyxl==3.1.5",
    "requests==2.32.5",
]

[tool.uv]
package = false
required-version = "==0.12.10"
# Deployment images use the existing Linux x86_64 CPU weights/runtime.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
