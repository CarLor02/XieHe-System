# Disposable query-cache Redis instance.
bind 0.0.0.0
port 6379
daemonize no
supervised no
loglevel notice
logfile ""
databases 1
maxclients 10000
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5
appendonly no
save ""
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
tcp-keepalive 60
timeout 300
